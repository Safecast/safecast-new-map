name: Crawl DeepWiki Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  crawl-deepwiki:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create package-lock.json for setup-node cache
        run: echo '{}' > package-lock.json

      - name: Crawl DeepWiki Documentation
        id: deepwiki
        uses: erayack/deepwiki-action@v1
        with:
          repository: ${{ github.repository }}
          max_concurrency: '3'
          request_timeout: '30000'
          retry_attempts: '3'

      - name: Check results
        run: |
          echo "Repository exists: ${{ steps.deepwiki.outputs.repo_exists }}"
          echo "DeepWiki URL: ${{ steps.deepwiki.outputs.deepwiki_url }}"
