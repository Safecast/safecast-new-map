name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum

      - name: Build binaries
        run: |
          go build -o safecast-new-map safecast-new-map.go
          go build -o safecast-mcp ./cmd/mcp-server/
          go build -o safecast-web-chat ./cmd/web-chat/

      - name: Prepare MCP hints directory
        run: |
          mkdir -p hints
          cp -r cmd/mcp-server/hints/* hints/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 65.108.24.131 >> ~/.ssh/known_hosts

      - name: Stop service
        run: |
          ssh -i ~/.ssh/deploy_key root@65.108.24.131 "systemctl stop safecast-new-map"

      - name: Deploy binary
        run: |
          rsync -avP -e "ssh -i ~/.ssh/deploy_key" ./safecast-new-map root@65.108.24.131:/usr/local/bin/

      - name: Start service
        run: |
          ssh -i ~/.ssh/deploy_key root@65.108.24.131 "systemctl start safecast-new-map"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key root@65.108.24.131 "systemctl status safecast-new-map"

      - name: Deploy MCP server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ssh -i ~/.ssh/deploy_key root@65.108.24.131 "systemctl stop safecast-mcp || true"
          rsync -avP -e "ssh -i ~/.ssh/deploy_key" ./safecast-mcp root@65.108.24.131:/root/safecast-mcp-server/safecast-mcp
          rsync -avP -e "ssh -i ~/.ssh/deploy_key" ./hints/ root@65.108.24.131:/root/safecast-mcp-server/hints/
          ssh -i ~/.ssh/deploy_key root@65.108.24.131 \
            "printf 'MCP_BASE_URL=https://simplemap.safecast.org/mcp\nDATABASE_URL=${DATABASE_URL}\nDUCKDB_PATH=/root/safecast-mcp-server/analytics.duckdb\nMCP_HINTS_DIR=/root/safecast-mcp-server/hints\n' > /root/safecast-mcp-server/.env && systemctl start safecast-mcp && systemctl status safecast-mcp"
        # Requires secret: DATABASE_URL (postgres connection string)

      - name: Deploy web-chat
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key root@65.108.24.131 "systemctl stop safecast-web-chat || true"
          rsync -avP -e "ssh -i ~/.ssh/deploy_key" ./safecast-web-chat root@65.108.24.131:/root/safecast-web-chat-server/safecast-web-chat
          ssh -i ~/.ssh/deploy_key root@65.108.24.131 \
            "printf 'MCP_URL=http://localhost:3333/mcp-http\nPORT=3334\nCLAUDE_MODEL=claude-haiku-4-5-20251001\nANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}\n' > /root/safecast-web-chat-server/.env && systemctl start safecast-web-chat && systemctl status safecast-web-chat"
        # Requires secret: ANTHROPIC_API_KEY

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id E12FYIQ8RRXOJ1 --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
