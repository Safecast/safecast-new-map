name: stable release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# ---------- PORTABLE: Unified server without CGO (no DuckDB analytics) ----------
jobs:
  mirror-skip:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI runs on GitHub only — skipping on mirror"

  build_portable:
    if: github.server_url == 'https://github.com' && (contains(toJson(github.event.head_commit.message), 'stable release') || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { goos: linux,  goarch: amd64, goversion: "1.25", runner: "ubuntu-24.04" }
          - { goos: linux,  goarch: arm64, goversion: "1.25", runner: "ubuntu-24.04" }
          - { goos: linux,  goarch: 386,   goversion: "1.25", runner: "ubuntu-24.04" }
          # macOS
          - { goos: darwin, goarch: amd64, goversion: "1.25", runner: "macos-13" }
          - { goos: darwin, goarch: arm64, goversion: "1.25", runner: "macos-14" }
          # *BSD
          - { goos: freebsd, goarch: amd64, goversion: "1.25", runner: "ubuntu-24.04" }
          - { goos: freebsd, goarch: arm64, goversion: "1.25", runner: "ubuntu-24.04" }
          - { goos: openbsd, goarch: amd64, goversion: "1.25", runner: "ubuntu-24.04" }
          - { goos: openbsd, goarch: arm64, goversion: "1.25", runner: "ubuntu-24.04" }
          - { goos: netbsd,  goarch: amd64, goversion: "1.25", runner: "ubuntu-24.04" }
          # Windows
          - { goos: windows, goarch: amd64, goversion: "1.25", runner: "windows-latest" }
          - { goos: windows, goarch: arm64, goversion: "1.25", runner: "windows-latest" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ matrix.goversion }}"
          cache: true
          cache-dependency-path: go.sum

      - name: go mod tidy (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: go mod tidy

      - name: go mod tidy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: go mod tidy

      - name: Build unified server (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          VERSION=${{ github.run_number }}
          mkdir -p dist
          BIN="safecast-new-map_${GOOS}_${GOARCH}"
          GOFLAGS="-trimpath -buildvcs=false" \
          go build -tags netgo,osusergo \
                   -ldflags "-s -w -X main.CompileVersion=$VERSION" \
                   -o "dist/${BIN}" ./cmd/unified-server

      - name: Build unified server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:CGO_ENABLED = "0"
          $version = "${{ github.run_number }}"
          New-Item -Force -ItemType Directory dist | Out-Null
          $bin = "safecast-new-map_${{ matrix.goos }}_${{ matrix.goarch }}.exe"
          go build -tags "netgo,osusergo" `
                   -ldflags "-s -w -X main.CompileVersion=$version" `
                   -o "dist/$bin" ./cmd/unified-server

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

# ---------- DUCKDB linux/amd64: dedicated job for deploy artifact ----------
  build_linux_duckdb:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Linux amd64 duckdb)
        uses: addnab/docker-run-action@v3
        with:
          image: golang:1.25
          options: -v ${{ github.workspace }}:/build -w /build
          run: |
            set -euo pipefail
            export CGO_ENABLED=1
            VERSION=${{ github.run_number }}
            mkdir -p dist
            apt-get update && apt-get install -y gcc libc6-dev
            GOFLAGS="-trimpath -buildvcs=false" \
            go build -tags "netgo,osusergo,duckdb" \
                     -ldflags "-s -w -X main.CompileVersion=$VERSION" \
                     -o "dist/safecast-new-map_linux_amd64_duckdb" ./cmd/unified-server

      - name: Upload linux/amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux_amd64_duckdb
          path: dist/

# ---------- DUCKDB: macOS release artifacts (failures do not block deploy) ----------
  build_duckdb:
    if: github.server_url == 'https://github.com' && (contains(toJson(github.event.head_commit.message), 'stable release') || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon)
          - { target: darwin_arm64_duckdb, goos: darwin, goarch: arm64, goversion: "1.25", runner: "macos-14", in_container: false }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (macOS)
        if: matrix.in_container == false
        uses: actions/setup-go@v5
        with:
          go-version: "${{ matrix.goversion }}"
          cache: true
          cache-dependency-path: go.sum

      - name: go mod tidy (macOS)
        if: matrix.in_container == false
        shell: bash
        run: |
          go get github.com/marcboeker/go-duckdb/v2@latest
          go mod tidy

      - name: Build (macOS duckdb)
        if: matrix.in_container == false
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          VERSION=${{ github.run_number }}
          mkdir -p dist
          BIN="safecast-new-map_${GOOS}_${GOARCH}_duckdb"
          GOFLAGS="-trimpath -buildvcs=false" \
          go build -tags "netgo,osusergo,duckdb" \
                   -ldflags "-s -w -X main.CompileVersion=$VERSION" \
                   -o "dist/${BIN}" ./cmd/unified-server

      - name: Upload duckdb artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/

# ---------- DEPLOY: Build linux/amd64 DuckDB binary and deploy to production ----------
# Currently runs on GitHub Actions. Plan: switch to Codeberg self-hosted runner on
# 65.108.24.131 to remove dependency on GitHub and shared runner queue issues.
# See memory: project_codeberg_migration.md for self-hosted runner setup plan.
  deploy:
    if: github.server_url == 'https://github.com' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build_linux_duckdb]
    runs-on: ubuntu-latest
    steps:
      - name: Download linux/amd64 DuckDB artifact
        uses: actions/download-artifact@v4
        with:
          name: bin-linux_amd64_duckdb
          path: dist/

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 65.108.24.131 >> ~/.ssh/known_hosts

      - name: Stop service
        run: ssh -i ~/.ssh/deploy_key root@65.108.24.131 "systemctl stop safecast-new-map"

      - name: Upload binary
        run: |
          chmod +x dist/safecast-new-map_linux_amd64_duckdb
          rsync -avP -e "ssh -i ~/.ssh/deploy_key" \
            dist/safecast-new-map_linux_amd64_duckdb \
            root@65.108.24.131:/usr/local/bin/safecast-new-map

      - name: Start service and verify
        run: |
          ssh -i ~/.ssh/deploy_key root@65.108.24.131 "systemctl restart safecast-new-map"
          sleep 5
          ssh -i ~/.ssh/deploy_key root@65.108.24.131 "systemctl is-active safecast-new-map"

  release:
    if: github.server_url == 'https://github.com'
    needs: [build_portable, build_linux_duckdb, build_duckdb]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-raw/

      - name: Publish GitHub Release (tag latest)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "download stable version - unified server with MCP + AI assistant"
          body: |
            ## Unified Server (Map + MCP + AI Assistant)
            
            This release contains a single unified binary with:
            - Radiation monitoring map server
            - MCP server for AI integration
            - Web chat interface (requires ANTHROPIC_API_KEY)
            - DuckDB analytics (in _duckdb variants)
            
            ### Usage
            
            **Basic (PostgreSQL only):**
            ```bash
            DATABASE_URL="postgres://user:pass@localhost/db" ./safecast-new-map_linux_amd64
            ```
            
            **With DuckDB analytics:**
            ```bash
            DATABASE_URL="postgres://..." DUCKDB_PATH="./analytics.duckdb" ./safecast-new-map_linux_amd64_duckdb
            ```
            
            **With AI assistant:**
            ```bash
            DATABASE_URL="postgres://..." \
            ANTHROPIC_API_KEY="your-key" \
            ./safecast-new-map_linux_amd64
            ```
            
            ### Endpoints
            
            - Map: http://localhost:8765/
            - MCP: http://localhost:8765/mcp-http
            - AI Chat: http://localhost:8765/assistant/
            - REST API: http://localhost:8765/api/
            - Swagger: http://localhost:8765/map-api/
          prerelease: false
          files: dist-raw/**/*
