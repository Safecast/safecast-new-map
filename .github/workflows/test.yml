name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mirror-skip:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI runs on GitHub only — skipping on mirror"

  test:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./pkg/... ./cmd/...

      - name: Verify generated Swagger docs are up to date
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          (cd cmd/mcp-server && "$(go env GOPATH)/bin/swag" init -g rest.go)
          (cd cmd/unified-server && "$(go env GOPATH)/bin/swag" init -g doc.go -o docs/api --parseDependency --parseInternal --parseDependencyLevel 2 --instanceName unifiedapi)
          git diff --exit-code -- cmd/mcp-server/docs cmd/unified-server/docs/api