<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Safecast</title>
  <style>
    :root {
      --primary-color: #4CAF50;
      --error-color: #f44336;
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
      --text-color: #333;
      --border-color: #ddd;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1e1e1e;
        --card-bg: #2d2d2d;
        --text-color: #e0e0e0;
        --border-color: #444;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      max-width: 450px;
      width: 100%;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: var(--text-color);
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-color);
      opacity: 0.7;
      margin-bottom: 32px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 16px;
      margin-bottom: 20px;
      background: var(--card-bg);
      color: var(--text-color);
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    button {
      width: 100%;
      padding: 16px;
      background: var(--primary-color);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }

    .message.error {
      background: rgba(244, 67, 54, 0.1);
      color: var(--error-color);
      border: 1px solid var(--error-color);
    }

    .message.success {
      background: rgba(76, 175, 80, 0.1);
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
    }

    .back-link {
      text-align: center;
      margin-top: 24px;
    }

    .back-link a {
      color: var(--primary-color);
      text-decoration: none;
      font-size: 14px;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .loader {
      border: 3px solid var(--border-color);
      border-top: 3px solid var(--primary-color);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reset Your Password</h1>
    <p class="subtitle">Enter your new password below</p>

    <form id="resetPasswordForm">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" placeholder="At least 8 characters" required minlength="8">

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>

      <button type="submit" id="submitBtn">Reset Password</button>
    </form>

    <div class="loader" id="loader"></div>
    <div class="message" id="message"></div>

    <div class="back-link">
      <a href="/">Back to Map</a>
    </div>
  </div>

  <script>
    // Extract token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const form = document.getElementById('resetPasswordForm');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    const loader = document.getElementById('loader');

    // Check if token exists
    if (!token) {
      messageEl.textContent = 'Invalid or missing reset token. Please request a new password reset link.';
      messageEl.className = 'message error';
      messageEl.style.display = 'block';
      submitBtn.disabled = true;
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Hide previous messages
      messageEl.style.display = 'none';

      // Validate passwords match
      if (password !== confirmPassword) {
        messageEl.textContent = 'Passwords do not match. Please try again.';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
        return;
      }

      // Validate password length
      if (password.length < 8) {
        messageEl.textContent = 'Password must be at least 8 characters long.';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
        return;
      }

      // Disable button and show loader
      submitBtn.disabled = true;
      loader.style.display = 'block';

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: password })
        });

        loader.style.display = 'none';

        if (response.ok) {
          messageEl.textContent = 'Password reset successful! Redirecting to map...';
          messageEl.className = 'message success';
          messageEl.style.display = 'block';

          // Redirect to map after 2 seconds
          setTimeout(function() {
            window.location.href = '/';
          }, 2000);
        } else {
          const error = await response.json();
          messageEl.textContent = error.error || 'Failed to reset password. The link may have expired.';
          messageEl.className = 'message error';
          messageEl.style.display = 'block';
          submitBtn.disabled = false;
        }
      } catch (error) {
        loader.style.display = 'none';
        messageEl.textContent = 'Network error. Please check your connection and try again.';
        messageEl.className = 'message error';
        messageEl.style.display = 'block';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
