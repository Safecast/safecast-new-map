basePath: /
definitions:
  auth.AdminCreateUserRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: StrongPass123!
        type: string
      requires_password_setup:
        example: false
        type: boolean
      send_welcome_email:
        example: true
        type: boolean
      username:
        example: jane_doe
        type: string
    type: object
  auth.AdminUpdateUserRequest:
    properties:
      email:
        example: updated@example.com
        type: string
      email_verified:
        example: true
        type: boolean
      external_id:
        example: auth0|abc123
        type: string
      is_active:
        example: true
        type: boolean
      is_admin:
        example: false
        type: boolean
      password:
        example: NewStrongPass123!
        type: string
      username:
        example: updated_name
        type: string
    type: object
  auth.User:
    properties:
      api_key:
        type: string
      created_at:
        type: integer
      email:
        type: string
      email_verified:
        type: boolean
      external_id:
        type: string
      external_source:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_admin:
        type: boolean
      last_login_at:
        type: integer
      requires_password_setup:
        type: boolean
      updated_at:
        type: integer
      username:
        type: string
    type: object
  main.trackInsight:
    properties:
      answer:
        type: string
      chat_id:
        type: integer
      feedback_score:
        type: integer
      question:
        type: string
      similarity_score:
        type: number
    type: object
  main.trackInsightsResponse:
    properties:
      insights:
        items:
          $ref: '#/definitions/main.trackInsight'
        type: array
      location_notes:
        items:
          $ref: '#/definitions/main.trackLocationNote'
        type: array
      track_id:
        type: string
    type: object
  main.trackLocationNote:
    properties:
      feedback_score:
        type: integer
      lat:
        type: number
      lon:
        type: number
      note:
        type: string
      source_chat_id:
        type: integer
    type: object
host: localhost:8765
info:
  contact:
    name: Safecast
    url: https://safecast.org
  description: Unified API documentation generated from Swaggo annotations in the
    unified server, HTTP API, and auth packages.
  license:
    name: CC0 1.0 Universal
    url: https://creativecommons.org/publicdomain/zero/1.0/
  title: Safecast Unified Server API
  version: "1.0"
paths:
  /api:
    get:
      description: Returns endpoint index, disclaimers, and dataset summary counts.
      produces:
      - application/json
      responses:
        "200":
          description: Overview payload
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            type: string
      summary: Get API overview
      tags:
      - core
  /api/admin/backfill:
    post:
      description: Backfills upload records from existing spectra entries.
      produces:
      - application/json
      responses:
        "200":
          description: Backfill result
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "503":
          description: Database unavailable
          schema:
            type: string
      summary: Admin backfill uploads from spectra
      tags:
      - admin
  /api/admin/backfill-countries:
    post:
      description: Starts background country backfill for markers with coordinates.
      produces:
      - application/json
      responses:
        "200":
          description: Backfill status
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "503":
          description: Database unavailable
          schema:
            type: string
      summary: Admin backfill marker countries
      tags:
      - admin
  /api/admin/cache:
    post:
      description: Performs cache operations such as clear/stats via action query
        parameter.
      parameters:
      - description: Cache action (e.g. clear, stats)
        in: query
        name: action
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Cache operation result
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Admin cache operations
      tags:
      - admin
  /api/admin/delete:
    post:
      consumes:
      - application/json
      description: Deletes a track and associated marker data.
      parameters:
      - description: Delete request payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Delete result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "503":
          description: Database unavailable
          schema:
            type: string
      summary: Admin delete single track
      tags:
      - admin
  /api/admin/delete-multiple:
    post:
      consumes:
      - application/json
      description: Deletes multiple tracks in one request.
      parameters:
      - description: Bulk delete request payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Delete result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "503":
          description: Database unavailable
          schema:
            type: string
      summary: Admin delete multiple tracks
      tags:
      - admin
  /api/admin/import-from-safecast:
    post:
      consumes:
      - application/json
      description: Triggers a date-ranged Safecast import and streams progress updates.
      produces:
      - text/event-stream
      responses:
        "200":
          description: Streaming progress
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "503":
          description: Database unavailable
          schema:
            type: string
      summary: Admin import from Safecast API
      tags:
      - admin
  /api/admin/mcp/data:
    get:
      description: Returns paginated MCP analytics rows for a selected table. For
        table=mcp_query_log, the columns are tool_name, created_at, duration_ms, result_count,
        client_info, and params.
      parameters:
      - description: Analytics table name
        enum:
        - chat_questions
        - mcp_query_log
        - mcp_ai_query_log
        in: query
        name: table
        required: true
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Sort column (for mcp_query_log, default is created_at)
        in: query
        name: sort
        type: string
      - description: 'Sort order: asc or desc'
        in: query
        name: order
        type: string
      - description: Search term
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Analytics rows
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid table
          schema:
            type: string
        "503":
          description: Analytics unavailable
          schema:
            type: string
      summary: Admin MCP analytics data
      tags:
      - admin
  /api/admin/mcp/delete:
    delete:
      description: Deletes selected or filtered MCP analytics rows. For table=mcp_query_log,
        ids map to created_at values.
      parameters:
      - description: Analytics table name
        enum:
        - chat_questions
        - mcp_query_log
        - mcp_ai_query_log
        in: query
        name: table
        required: true
        type: string
      - description: Comma-separated row IDs
        in: query
        name: ids
        type: string
      - description: Delete all filtered rows
        in: query
        name: all
        type: boolean
      - description: Search term when all=true
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Delete result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            type: string
        "503":
          description: Analytics unavailable
          schema:
            type: string
      summary: Admin MCP analytics delete
      tags:
      - admin
    post:
      description: Deletes selected or filtered MCP analytics rows. For table=mcp_query_log,
        ids map to created_at values.
      parameters:
      - description: Analytics table name
        enum:
        - chat_questions
        - mcp_query_log
        - mcp_ai_query_log
        in: query
        name: table
