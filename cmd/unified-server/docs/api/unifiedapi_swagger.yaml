      - admin
  /api/admin/mcp/export:
    get:
      description: Exports MCP analytics rows as CSV for a selected table. For table=mcp_query_log,
        rows are ordered by created_at descending.
      parameters:
      - description: Analytics table name
        enum:
        - chat_questions
        - mcp_query_log
