      summary: Find nearby radiation readings (GPT compact)
      tags:
      - historical
  /gpt/stats:
    get:
      description: Proxies the aggregate statistics endpoint for GPT Actions.
      produces:
      - application/json
      responses:
        "200":
          description: Aggregate statistics
          schema:
            additionalProperties: true
            type: object
        "405":
          description: Method not allowed
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get aggregate statistics (GPT compact)
      tags:
      - reference
  /info/{topic}:
    get:
      description: Returns static educational reference content about radiation units,
        safety levels, detector types, background levels, and isotopes.
      parameters:
      - description: Topic to retrieve
        enum:
        - units
        - dose_rates
        - safety_levels
        - detectors
        - background_levels
        - isotopes
        in: path
        name: topic
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Reference content for the requested topic
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid or missing topic
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get radiation reference information
      tags:
      - reference
  /licenses/{code}:
    get:
      description: Returns embedded license content for supported license codes.
      parameters:
      - description: 'License code: mit or cc0'
        in: path
        name: code
        required: true
        type: string
      responses:
        "200":
          description: License text
          schema:
            type: string
        "404":
          description: License not found
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
      summary: Download project license text
      tags:
      - web
  /qrpng:
    get:
      description: Returns a QR image for query parameter `u`, referer, or current
        URL.
      parameters:
      - description: Target URL to encode
        in: query
        name: u
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: QR PNG
          schema:
            type: file
        "500":
          description: QR generation failed
          schema:
            type: string
      summary: Generate QR PNG
      tags:
      - web
  /radiation:
    get:
      description: Returns historical bGeigie measurements within a radius of the
        given coordinates, sorted by most recent. Uses PostGIS spatial index for fast
        queries. Falls back to Safecast REST API if no database is configured.
      parameters:
      - description: Latitude in decimal degrees (-90 to 90)
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude in decimal degrees (-180 to 180)
        in: query
        name: lon
        required: true
        type: number
      - default: 1500
        description: Search radius in meters (25 to 50000)
        in: query
        name: radius_m
        type: number
      - default: 25
        description: Maximum number of results (1 to 10000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Radiation measurements with count, source, and query metadata
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Find radiation measurements near a location
      tags:
      - historical
  /realtime_history:
    get:
      description: Returns aggregated realtime history and summary ranges for a device.
      parameters:
      - description: Realtime device ID
        in: query
        name: device
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Realtime history payload
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing device
          schema:
            type: string
        "404":
          description: Realtime feature disabled
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      summary: Get realtime device history
      tags:
      - map
  /s/{code}:
    get:
      description: Looks up a short code and redirects to its stored target URL.
      responses:
        "302":
          description: Redirect
          schema:
            type: string
        "404":
          description: Code not found
          schema:
            type: string
        "502":
          description: Invalid redirect target
          schema:
            type: string
      summary: Resolve short URL code
      tags:
      - web
  /sensor/{id}/current:
    get:
      description: Routes to current or history endpoint based on the path suffix.
        Use /current for the latest reading, /history for time-series data.
      parameters:
      - description: Device identifier
        in: path
        name: id
        required: true
        type: string
      - description: Start date for history (YYYY-MM-DD) — required for /history
        in: query
        name: start_date
        type: string
      - description: 'End date for history (YYYY-MM-DD, default: today)'
        in: query
        name: end_date
        type: string
      - default: 25
        description: Maximum number of results (1 to 1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Sensor readings
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get readings from a specific sensor
      tags:
      - realtime
  /sensor/{id}/history:
    get:
      description: Routes to current or history endpoint based on the path suffix.
        Use /current for the latest reading, /history for time-series data.
      parameters:
      - description: Device identifier
        in: path
        name: id
        required: true
        type: string
      - description: Start date for history (YYYY-MM-DD) — required for /history
        in: query
        name: start_date
        type: string
      - description: 'End date for history (YYYY-MM-DD, default: today)'
        in: query
        name: end_date
        type: string
      - default: 25
        description: Maximum number of results (1 to 1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Sensor readings
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get readings from a specific sensor
      tags:
      - realtime
  /sensors:
    get:
      description: Lists active fixed radiation sensors (Pointcast, Solarcast, bGeigieZen,
        etc.) with their location, type, and last reading timestamp. Requires database
        connection.
      parameters:
      - description: Filter by sensor type (e.g. Pointcast, Solarcast, bGeigieZen)
        in: query
        name: type
        type: string
      - default: -90
        description: Southern boundary latitude
        in: query
        name: min_lat
        type: number
      - default: 90
        description: Northern boundary latitude
        in: query
        name: max_lat
        type: number
      - default: -180
        description: Western boundary longitude
        in: query
        name: min_lon
        type: number
      - default: 180
        description: Eastern boundary longitude
        in: query
        name: max_lon
        type: number
      - default: 50
        description: Maximum number of sensors (1 to 1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Sensor list with locations and last reading times
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Discover active fixed sensors
      tags:
      - realtime
  /sensors/export:
    get:
      description: Downloads all active fixed sensors matching the given filters in
        CSV, JSON, or Excel format. No row limit — returns up to 10 000 devices.
      parameters:
      - description: 'Output format: csv (default), json, xlsx'
        in: query
        name: format
        type: string
      - description: Filter by sensor type
        in: query
        name: type
        type: string
      - default: -90
        description: Southern boundary
        in: query
        name: min_lat
        type: number
      - default: 90
        description: Northern boundary
        in: query
        name: max_lat
        type: number
      - default: -180
        description: Western boundary
        in: query
        name: min_lon
        type: number
      - default: 180
        description: Eastern boundary
        in: query
        name: max_lon
        type: number
      produces:
      - text/csv
      - application/json
      - application/vnd.ms-excel
      responses:
        "200":
          description: Sensor data file
          schema:
            type: string
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Export all active sensors
      tags:
      - realtime
  /spectra:
    get:
      description: Returns spectroscopy metadata (filename, device model, energy range,
        location) without channel data. Use GET /api/spectrum/{marker_id} to fetch
        full channel data. Requires database connection.
      parameters:
      - description: Southern boundary latitude (requires all 4 bbox params)
        in: query
        name: min_lat
        type: number
      - description: Northern boundary latitude (requires all 4 bbox params)
        in: query
        name: max_lat
        type: number
      - description: Western boundary longitude (requires all 4 bbox params)
        in: query
        name: min_lon
        type: number
      - description: Eastern boundary longitude (requires all 4 bbox params)
        in: query
        name: max_lon
        type: number
      - description: Filter by file format (e.g. spe, csv)
        in: query
        name: source_format
        type: string
      - description: Filter by detector model name (partial match)
        in: query
        name: device_model
        type: string
      - description: Filter by track identifier
        in: query
        name: track_id
        type: string
      - default: 50
        description: Maximum number of results (1 to 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Spectroscopy records with metadata
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Browse gamma spectroscopy records
      tags:
      - spectroscopy
  /spectrum/{marker_id}:
    get:
      description: Returns complete gamma spectroscopy data including all channel
        counts for the specified measurement point. Use GET /api/spectra to find marker
        IDs.
      parameters:
      - description: Marker/measurement identifier
        in: path
        name: marker_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Full spectroscopy channel data
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid marker_id
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get full spectroscopy channel data
      tags:
      - spectroscopy
  /stats:
    get:
      description: Returns aggregate radiation dose-rate statistics from the Safecast
        database grouped by time interval. Powered by DuckDB + PostgreSQL.
      parameters:
      - default: year
        description: 'Aggregation interval: year, month, or overall'
        enum:
        - year
        - month
        - overall
        in: query
        name: interval
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Statistics data with interval and source metadata
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid interval value
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Analytics engine unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get aggregate radiation statistics
      tags:
      - reference
  /stream_markers:
    get:
      description: Streams map markers as SSE by default, or MessagePack when requested
        via query/header.
      parameters:
      - description: Requested map zoom
        in: query
        name: zoom
        type: integer
      - description: Minimum latitude
        in: query
        name: minLat
        required: true
        type: number
      - description: Minimum longitude
        in: query
        name: minLon
        required: true
        type: number
      - description: Maximum latitude
        in: query
        name: maxLat
        required: true
        type: number
      - description: Maximum longitude
        in: query
        name: maxLon
        required: true
        type: number
      - description: Single track ID filter
        in: query
        name: trackID
        type: string
      - description: Comma-separated track IDs filter
        in: query
        name: trackIDs
        type: string
      - description: Set to msgpack for binary stream
        in: query
        name: format
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Streaming response
          schema:
            type: string
        "500":
          description: Streaming unsupported
          schema:
            type: string
      summary: Stream markers for viewport
      tags:
      - map
  /track/{id}:
    get:
      description: Retrieves radiation measurements recorded during a specific bGeigie
        drive. The path ID can be used directly from a simplemap track URL (for example
        /trackid/{id}). This REST endpoint returns measurement rows; statistical-only
        summaries (min/max/percentiles/top peaks) are available via the MCP get_track
        tool with stats_only=true.
      parameters:
      - description: Track identifier (e.g. 8eh5m1)
        in: path
        name: id
        required: true
        type: string
      - description: Start marker ID for filtering
        in: query
        name: from
        type: integer
      - description: End marker ID for filtering
        in: query
        name: to
        type: integer
      - default: 200
        description: Maximum number of results (1 to 10000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Measurements for the track
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all measurements from a specific track
      tags:
      - historical
  /track/{id}/insights:
    get:
      description: Returns positively-rated Q&A pairs and curated location notes that
        are semantically or spatially relevant to the given bGeigie track. Requires
        DuckDB analytics and OpenAI embeddings. Returns empty arrays when analytics
        are unavailable.
      parameters:
      - description: Track identifier (e.g. 8eh5m1)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Insights and location notes for the track
          schema:
            $ref: '#/definitions/main.trackInsightsResponse'
        "400":
          description: Track id required
          schema:
            type: string
        "404":
          description: Track not found
          schema:
            type: string
        "503":
          description: Database not available
          schema:
            type: string
      summary: Get cached Q&A insights for a track
      tags:
      - historical
  /tracks:
    get:
      description: Lists bGeigie Import tracks (bulk radiation measurement drives).
        Each track represents measurements from a single bGeigie session. Can filter
        by year, month, and detector/device name.
      parameters:
      - description: Filter by year (2000–2100)
        in: query
        name: year
        type: integer
      - description: Filter by month (1–12, requires year)
        in: query
        name: month
        type: integer
      - description: Filter by detector/device name (e.g., 'bGeigieZen', 'bGeigie',
          'Pointcast'). Partial match supported.
        in: query
        name: detector
        type: string
      - default: 50
        description: Maximum number of results (1 to 50000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Track list with count and filter metadata
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Browse bGeigie measurement tracks
      tags:
      - historical
  /tracks/{ids}:
    get:
      description: Serves the HTML map page with multiple track IDs from a comma-separated
        path segment.
      parameters:
      - description: Comma-separated track IDs
        in: path
        name: ids
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
        "400":
          description: Track IDs missing
          schema:
            type: string
      summary: Render map page for multiple tracks
      tags:
      - web
  /upload:
    post:
      consumes:
      - multipart/form-data
      description: Accepts one or more files in multipart form field `files[]` and
        returns a track ID for async progress polling.
      produces:
      - application/json
      responses:
        "200":
          description: Upload accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid upload
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      summary: Upload radiation files
      tags:
      - map
  /upload/progress:
    get:
      description: Streams upload progress events for a previously submitted upload
        track ID.
      parameters:
      - description: Upload tracking ID returned by /upload
        in: query
        name: trackid
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Missing trackid
          schema:
            type: string
      summary: Stream upload progress
      tags:
      - map
schemes:
- http
- https
swagger: "2.0"
tags:
- description: Core /api dataset and track endpoints
  name: core
- description: Web utility endpoints used by the map UI
  name: web
- description: Authentication and user account endpoints
  name: auth
- description: Admin-only endpoints
  name: admin
- description: Map data and streaming endpoints
  name: map
