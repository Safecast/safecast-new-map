basePath: /
definitions:
  safecast.BgeigieImportRails:
    properties:
      approved:
        type: boolean
      created_at:
        type: string
      id:
        type: integer
      md5sum:
        type: string
      measurements_count:
        type: integer
      name:
        type: string
      source:
        $ref: '#/definitions/safecast.SourceRails'
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  safecast.CountRails:
    properties:
      count:
        type: integer
    type: object
  safecast.DeviceRails:
    properties:
      id:
        type: integer
      manufacturer:
        type: string
      model:
        type: string
      sensor:
        type: string
    type: object
  safecast.ErrorsRails:
    properties:
      errors:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
    type: object
  safecast.MeasurementRails:
    properties:
      captured_at:
        type: string
      channel_id:
        type: integer
      device_id:
        type: integer
      devicetype_id:
        type: integer
      height:
        type: number
      id:
        type: integer
      latitude:
        type: number
      location_name:
        type: string
      longitude:
        type: number
      measurement_import_id:
        type: integer
      original_id:
        type: integer
      sensor_id:
        type: integer
      station_id:
        type: integer
      unit:
        type: string
      user_id:
        type: integer
      value:
        type: number
    type: object
  safecast.RootRails:
    properties:
      name:
        type: string
      subresource_uris:
        items:
          type: string
        type: array
      uri:
        type: string
    type: object
  safecast.SourceRails:
    properties:
      url:
        type: string
    type: object
  safecast.UserRails:
    properties:
      authentication_token:
        type: string
      id:
        type: integer
      measurements_count:
        type: integer
      name:
        type: string
    type: object
host: api.safecast.org
info:
  contact:
    name: Safecast
  description: 'Safecast API: measurements, bgeigie_imports, users, devices. Adapter
    (unversioned + v1) and v2 routes share the same core.'
  license:
    name: MIT
  title: Safecast API
  version: "1.0"
paths:
  /airnote:
    get:
      consumes:
      - application/json
      description: Returns airnote data. Returns 501 Not Implemented.
      produces:
      - application/json
      responses:
        "405":
          description: Method not allowed
        "501":
          description: Not implemented
      summary: Airnote
      tags:
      - API v1
  /api/v1:
    get:
      consumes:
      - application/json
      description: Returns the Safecast API root with name, URI, and subresource links.
        Also at / and /api/v2.
      produces:
      - application/json
      responses:
        "200":
          description: Root descriptor with subresource_uris
          schema:
            $ref: '#/definitions/safecast.RootRails'
        "405":
          description: Method not allowed
        "406":
          description: Accept must be application/json
      summary: API root
      tags:
      - API v1
  /api/v1/bgeigie_imports:
    get:
      consumes:
      - application/json
      description: Returns bGeigie import records. Also at /bgeigie_imports and /api/v2/bgeigie_imports.
      parameters:
      - description: Search query
        in: query
        name: q
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by user ID
        in: query
        name: by_user_id
        type: string
      - description: Filter created_at >=
        in: query
        name: uploaded_after
        type: string
      - description: Filter created_at <
        in: query
        name: uploaded_before
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: string
      - description: Per page (default 25)
        in: query
        name: per_page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of bGeigie imports
          schema:
            items:
              $ref: '#/definitions/safecast.BgeigieImportRails'
            type: array
        "405":
          description: Method not allowed
        "406":
          description: Accept must be application/json
      summary: List bGeigie imports
      tags:
      - API v1
    post:
      consumes:
      - application/json
      description: Upload/create a bGeigie import. Requires API key. Returns 501 Not
        Implemented.
      parameters:
      - description: API key (or X-API-Key header)
        in: query
        name: api_key
        type: string
      produces:
      - application/json
      responses:
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
        "406":
          description: Accept must be application/json
        "501":
          description: Not implemented
      summary: Create bGeigie import
      tags:
      - API v1
  /api/v1/bgeigie_imports/{id}:
    get:
      consumes:
      - application/json
      description: Returns one bGeigie import by numeric ID. Also at /bgeigie_imports/:id
        and /api/v2/bgeigie_imports/:id.
      parameters:
      - description: Bgeigie import ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Bgeigie import
          schema:
            $ref: '#/definitions/safecast.BgeigieImportRails'
        "404":
          description: Not found
        "405":
          description: Method not allowed
        "406":
          description: Accept must be application/json
      summary: Get bGeigie import by ID
      tags:
      - API v1
  /api/v1/count:
    get:
      consumes:
      - application/json
      description: Returns total count with same query params as list. Also at /count
        and /api/v2/count.
      parameters:
      - description: Center latitude
        in: query
        name: latitude
        type: string
      - description: Center longitude
        in: query
        name: longitude
        type: string
      - description: Max distance (km)
        in: query
        name: distance
        type: string
      - description: Filter captured_at >=
        in: query
        name: captured_after
        type: string
      - description: Filter captured_at <
        in: query
        name: captured_before
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by device ID
        in: query
        name: device_id
        type: string
      - description: Filter by measurement_import_id
        in: query
        name: measurement_import_id
        type: string
      - description: Filter by original_id
        in: query
        name: original_id
        type: string
      - description: Alias for captured_after
        in: query
        name: since
        type: string
      - description: Alias for captured_before
        in: query
        name: until
        type: string
      - description: Filter by unit
        in: query
        name: unit
        type: string
      - description: Sort order
        in: query
        name: order
        type: string
      - description: Page (for consistency; count ignores)
        in: query
        name: page
        type: string
      - description: Per page (for consistency; count ignores)
        in: query
        name: per_page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Count
          schema:
            $ref: '#/definitions/safecast.CountRails'
        "405":
          description: Method not allowed
        "406":
          description: Accept must be application/json
      summary: Count measurements
      tags:
      - API v1
  /api/v1/devices:
    get:
      consumes:
      - application/json
      description: Returns devices. Stub implementation returns empty array. Also
        at /devices and /api/v2/devices.
      produces:
      - application/json
      responses:
        "200":
          description: 'List of devices (stub: empty)'
          schema:
            items:
              $ref: '#/definitions/safecast.DeviceRails'
            type: array
        "405":
          description: Method not allowed
        "406":
          description: Accept must be application/json
      summary: List devices
      tags:
      - API v1
  /api/v1/devices/{id}:
    get:
      consumes:
      - application/json
      description: Returns one device by ID. Returns 501 Not Implemented.
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "405":
          description: Method not allowed
        "406":
          description: Accept must be application/json
        "501":
          description: Not implemented
      summary: Get device by ID
      tags:
      - API v1
  /api/v1/measurements:
    get:
      consumes:
      - application/json
      description: Returns measurements with optional filters. Also at /measurements
        and /api/v2/measurements.
      parameters:
      - description: Center latitude for distance filter
        in: query
        name: latitude
        type: string
      - description: Center longitude for distance filter
        in: query
        name: longitude
        type: string
      - description: Max distance (km) from lat/lon
        in: query
        name: distance
        type: string
      - description: Filter by captured_at >= (ISO8601 or timestamp)
        in: query
        name: captured_after
        type: string
      - description: Filter by captured_at <
        in: query
        name: captured_before
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by device ID
        in: query
        name: device_id
        type: string
      - description: Filter by measurement_import_id
        in: query
        name: measurement_import_id
        type: string
      - description: Filter by original_id
        in: query
        name: original_id
        type: string
      - description: Alias for captured_after
        in: query
        name: since
        type: string
      - description: Alias for captured_before
        in: query
        name: until
        type: string
      - description: Filter by unit (e.g. cpm)
        in: query
        name: unit
        type: string
      - description: Sort order
        in: query
        name: order
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: string
      - description: Per page (default 100)
        in: query
        name: per_page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of measurements
          schema:
            items:
              $ref: '#/definitions/safecast.MeasurementRails'
            type: array
        "405":
          description: Method not allowed
        "406":
          description: Accept must be application/json
      summary: List measurements
      tags:
      - API v1
    post:
      consumes:
      - application/json
      description: Creates a measurement. Requires api_key query or X-API-Key header.
        Also at /measurements and /api/v2/measurements.
      parameters:
      - description: API key (or use X-API-Key header)
        in: query
        name: api_key
        type: string
      - description: 'JSON: { \'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Created measurement
          schema:
            $ref: '#/definitions/safecast.MeasurementRails'
        "401":
          description: Unauthorized (missing or invalid API key)
        "405":
          description: Method not allowed
        "406":
          description: Accept must be application/json
        "422":
          description: Validation errors (invalid JSON or value can't be blank)
          schema:
            $ref: '#/definitions/safecast.ErrorsRails'
      summary: Create measurement
      tags:
      - API v1
  /api/v1/measurements/{id}:
    get:
      consumes:
      - application/json
      description: Returns one measurement by numeric ID. Also at /measurements/:id
        and /api/v2/measurements/:id.
      parameters:
      - description: Measurement ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Measurement
          schema:
            $ref: '#/definitions/safecast.MeasurementRails'
        "404":
          description: Not found
        "405":
          description: Method not allowed
        "406":
          description: Accept must be application/json
      summary: Get measurement by ID
      tags:
      - API v1
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: Returns users. Stub implementation returns empty array. Also at
        /users and /api/v2/users.
      produces:
      - application/json
      responses:
        "200":
          description: 'List of users (stub: empty)'
          schema:
            items:
              $ref: '#/definitions/safecast.UserRails'
            type: array
        "405":
          description: Method not allowed
        "406":
          description: Accept must be application/json
      summary: List users
      tags:
      - API v1
  /api/v1/users/{id}:
    get:
      consumes:
      - application/json
      description: Returns one user by ID. Returns 501 Not Implemented.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "405":
          description: Method not allowed
        "406":
          description: Accept must be application/json
        "501":
          description: Not implemented
      summary: Get user by ID
      tags:
      - API v1
  /api/v2:
    get:
      consumes:
      - application/json
      description: Returns the Safecast API root with name, URI, and subresource links.
        Same response as /api/v1.
      produces:
      - application/json
      responses:
        "200":
          description: Root descriptor with subresource_uris
          schema:
            $ref: '#/definitions/safecast.RootRails'
        "405":
          description: Method not allowed
      summary: API root (v2)
      tags:
      - API v2
  /api/v2/bgeigie_imports:
    get:
      consumes:
      - application/json
      description: Returns bGeigie import records. Also supports POST (same as v1;
        returns 501 Not Implemented).
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: string
      - description: Per page (default 25)
        in: query
        name: per_page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of bGeigie imports
          schema:
            items:
              $ref: '#/definitions/safecast.BgeigieImportRails'
            type: array
        "405":
          description: Method not allowed
      summary: List bGeigie imports (v2)
      tags:
      - API v2
  /api/v2/bgeigie_imports/{id}:
    get:
      consumes:
      - application/json
      description: Returns one bGeigie import by numeric ID. Same response as /api/v1/bgeigie_imports/{id}.
      parameters:
      - description: Bgeigie import ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Bgeigie import
          schema:
            $ref: '#/definitions/safecast.BgeigieImportRails'
        "404":
          description: Not found
        "405":
          description: Method not allowed
      summary: Get bGeigie import by ID (v2)
      tags:
      - API v2
  /api/v2/device_stories:
    get:
      consumes:
      - application/json
      description: Returns device stories. Stub returns empty array.
      produces:
      - application/json
      responses:
        "200":
          description: 'Stub: empty array'
          schema:
            items:
              type: object
            type: array
        "405":
          description: Method not allowed
      summary: List device stories (v2)
      tags:
      - API v2
  /api/v2/device_stories/{id}:
    get:
      consumes:
      - application/json
      description: Returns one device story. Returns 501 Not Implemented.
      parameters:
      - description: Device story ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "405":
          description: Method not allowed
        "501":
          description: Not implemented
      summary: Get device story by ID (v2)
      tags:
      - API v2
  /api/v2/devices:
    get:
      consumes:
      - application/json
      description: Returns devices. Stub implementation returns empty array. Same
        as /api/v1/devices.
      produces:
      - application/json
      responses:
        "200":
          description: 'List of devices (stub: empty)'
          schema:
            items:
              $ref: '#/definitions/safecast.DeviceRails'
            type: array
        "405":
          description: Method not allowed
      summary: List devices (v2)
      tags:
      - API v2
  /api/v2/devices/{id}:
    get:
      consumes:
      - application/json
      description: Returns one device by ID. Returns 501 Not Implemented (stub).
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "405":
          description: Method not allowed
        "501":
          description: Not implemented
      summary: Get device by ID (v2)
      tags:
      - API v2
  /api/v2/ingest:
    get:
      consumes:
      - application/json
      description: Returns ingest data. Stub returns empty array.
      produces:
      - application/json
      responses:
        "200":
          description: 'Stub: empty array'
          schema:
            items:
              type: object
            type: array
        "405":
          description: Method not allowed
      summary: Ingest (v2)
      tags:
      - API v2
  /api/v2/measurements:
    get:
      consumes:
      - application/json
      description: Returns measurements with optional filters. Also supports POST
        to create (same body as v1).
      parameters:
      - description: Center latitude for distance filter
        in: query
        name: latitude
        type: string
      - description: Center longitude for distance filter
        in: query
        name: longitude
        type: string
      - description: Max distance (km) from lat/lon
        in: query
        name: distance
        type: string
      - description: Filter by captured_at >=
        in: query
        name: captured_after
        type: string
      - description: Filter by captured_at <
        in: query
        name: captured_before
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by device ID
        in: query
        name: device_id
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: string
      - description: Per page (default 100)
        in: query
        name: per_page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of measurements
          schema:
            items:
              $ref: '#/definitions/safecast.MeasurementRails'
            type: array
        "405":
          description: Method not allowed
      summary: List measurements (v2)
      tags:
      - API v2
  /api/v2/measurements/{id}:
    get:
      consumes:
      - application/json
      description: Returns one measurement by numeric ID. Same response as /api/v1/measurements/{id}.
      parameters:
      - description: Measurement ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Measurement
          schema:
            $ref: '#/definitions/safecast.MeasurementRails'
        "404":
